[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autourgos-memory"
version = "2.1.0"
description = "Unified memory package for Autourgos agents — base interfaces plus every concrete memory implementation (buffer, local, semantic, summary, token, vector, episodic)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    {name = "Jitin Kumar Sengar", email = "devxjitin@gmail.com"}
]
maintainers = [
    {name = "Sonia"},
    {name = "Vishwanil Suman"},
]
keywords = ["autourgos", "agent", "memory", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "autourgos-core>=0.9.0",
]

[project.optional-dependencies]
vector = ["numpy>=1.24"]
tiktoken = ["tiktoken>=0.5"]
all = ["autourgos-memory[vector,tiktoken]"]


[project.urls]
Homepage = "https://github.com/devxjitin/autourgos-memory"
Repository = "https://github.com/devxjitin/autourgos-memory"
Issues = "https://github.com/devxjitin/autourgos-memory/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["autourgos_memory*"]

[tool.setuptools.package-data]
autourgos_memory = ["py.typed"]
